name: onion-store

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: onion_store
      MYSQL_USER: onion
      MYSQL_PASSWORD: onion
      MYSQL_ROOT_PASSWORD: root1234
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot1234"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
