name: onion-store

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onion-store-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/onion_store?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: onion
      SPRING_DATASOURCE_PASSWORD: onion
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.4
    container_name: onion-store-mysql
    environment:
      MYSQL_DATABASE: onion_store
      MYSQL_USER: onion
      MYSQL_PASSWORD: onion
      MYSQL_ROOT_PASSWORD: root1234
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot1234"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis:
    image: redis:7.4
    container_name: onion-store-redis
    ports:
      - "6379:6379"