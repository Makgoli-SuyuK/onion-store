<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>환불 API 테스트</title>
    <style>
        :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1f2937; background: #f8fafc; }
        body { max-width: 1040px; margin: 40px auto; padding: 0 20px 48px; }
        h1 { margin: 0 0 8px; }
        h2 { margin: 0 0 16px; font-size: 20px; }
        p { line-height: 1.55; }
        .muted { color: #64748b; }
        .notice { margin: 20px 0; padding: 14px 16px; color: #1e3a8a; background: #eff6ff; border-radius: 8px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
        section { padding: 20px; background: white; border: 1px solid #e2e8f0; border-radius: 12px; }
        form, .controls { display: grid; gap: 12px; }
        label { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
        input, textarea, select { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
        textarea { min-height: 80px; resize: vertical; }
        button { padding: 10px 14px; border: 0; border-radius: 6px; color: white; background: #2563eb; font: inherit; cursor: pointer; }
        button.secondary { background: #475569; }
        button.danger { background: #dc2626; }
        button:disabled { cursor: not-allowed; background: #94a3b8; }
        .item-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
        .item-row button { background: #64748b; }
        .horizontal { display: flex; gap: 8px; flex-wrap: wrap; }
        #result { min-height: 200px; overflow: auto; padding: 16px; color: #e2e8f0; background: #0f172a; border-radius: 8px; white-space: pre-wrap; }
        code { padding: 2px 4px; background: #e2e8f0; border-radius: 4px; }
        @media (max-width: 520px) { .item-row { grid-template-columns: 1fr 1fr; } .item-row button { grid-column: 1 / -1; } }
    </style>
</head>
<body>
<h1>환불 API 테스트</h1>
<p class="muted">고객 환불 요청부터 관리자 승인·거절, 조회까지 로컬 서버에서 확인하는 테스트 페이지입니다.</p>
<div class="notice">
    JWT는 브라우저 저장소에 저장하지 않습니다. 고객 API에는 CUSTOMER 토큰, 관리자 API에는 ADMIN 토큰을 입력하세요.
    <br>실제 PortOne 취소는 승인 버튼을 누를 때 실행됩니다.
</div>

<div class="grid">
    <section>
        <h2>고객 환불 요청</h2>
        <form id="customer-request-form">
            <label>고객 Access Token<textarea id="customer-token" placeholder="Bearer 접두어 없이 JWT만 입력" required></textarea></label>
            <label>주문 ID<input id="order-id" type="number" min="1" required></label>
            <label>환불 사유<textarea id="request-reason" maxlength="500" placeholder="예: 상품 일부가 파손되었습니다." required></textarea></label>
            <div>
                <strong>환불할 주문 항목</strong>
                <div id="item-rows" class="controls" style="margin-top: 8px;"></div>
                <button id="add-item" class="secondary" type="button" style="margin-top: 8px;">항목 추가</button>
            </div>
            <button type="submit">환불 요청 접수</button>
        </form>
    </section>

    <section>
        <h2>고객 환불 조회</h2>
        <div class="controls">
            <button id="get-my-refunds" type="button">내 환불 목록 조회</button>
            <label>환불 ID<input id="customer-refund-id" type="number" min="1"></label>
            <button id="get-my-refund-detail" class="secondary" type="button">내 환불 상세 조회</button>
        </div>
    </section>

    <section>
        <h2>관리자 환불 처리</h2>
        <div class="controls">
            <label>관리자 Access Token<textarea id="admin-token" placeholder="관리자 JWT" required></textarea></label>
            <label>환불 ID<input id="admin-refund-id" type="number" min="1" required></label>
            <div class="horizontal">
                <button id="get-admin-refund-detail" class="secondary" type="button">상세 조회</button>
                <button id="approve-refund" type="button">승인 및 PortOne 취소 요청</button>
            </div>
            <label>거절 사유<textarea id="reject-reason" maxlength="500" placeholder="거절할 때만 입력"></textarea></label>
            <button id="reject-refund" class="danger" type="button">환불 요청 거절</button>
        </div>
    </section>

    <section>
        <h2>관리자 환불 목록</h2>
        <div class="controls">
            <label>상태
                <select id="refund-status">
                    <option value="">전체</option>
                    <option value="PENDING_APPROVAL">PENDING_APPROVAL</option>
                    <option value="REQUESTED">REQUESTED</option>
                    <option value="COMPLETED">COMPLETED</option>
                    <option value="REJECTED">REJECTED</option>
                    <option value="FAILED">FAILED</option>
                </select>
            </label>
            <div class="item-row">
                <label>시작일<input id="from-date" type="date"></label>
                <label>종료일<input id="to-date" type="date"></label>
                <button id="get-admin-refunds" class="secondary" type="button">목록 조회</button>
            </div>
        </div>
    </section>
</div>

<section style="margin-top: 16px;">
    <h2>API 응답</h2>
    <pre id="result">요청 결과가 여기에 표시됩니다.</pre>
</section>

<script>
    const resultElement = document.getElementById('result');
    const itemRows = document.getElementById('item-rows');

    function showResult(method, url, status, body) {
        resultElement.textContent = `${method} ${url}\nHTTP ${status}\n\n${JSON.stringify(body, null, 2)}`;
    }

    function tokenOf(id) {
        const token = document.getElementById(id).value.trim();
        if (!token) {
            throw new Error('Access Token을 입력하세요.');
        }
        return token.replace(/^Bearer\s+/i, '');
    }

    function numberOf(id, label) {
        const value = Number(document.getElementById(id).value);
        if (!Number.isSafeInteger(value) || value < 1) {
            throw new Error(`${label}를 1 이상 정수로 입력하세요.`);
        }
        return value;
    }

    async function request(method, url, token, body) {
        const options = {
            method,
            headers: { Authorization: `Bearer ${token}` }
        };
        if (body !== undefined) {
            options.headers['Content-Type'] = 'application/json';
            options.body = JSON.stringify(body);
        }

        const response = await fetch(url, options);
        const text = await response.text();
        let parsed;
        try {
            parsed = text ? JSON.parse(text) : {};
        } catch {
            parsed = { message: text || '응답 본문이 없습니다.' };
        }
        showResult(method, url, response.status, parsed);
        if (!response.ok) {
            throw new Error(parsed.message || `요청이 실패했습니다. (${response.status})`);
        }
        return parsed;
    }

    function addItemRow() {
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
            <label>주문 항목 ID<input class="order-item-id" type="number" min="1" required></label>
            <label>환불 수량<input class="refund-quantity" type="number" min="1" value="1" required></label>
            <button class="remove-item" type="button">삭제</button>
        `;
        row.querySelector('.remove-item').addEventListener('click', () => {
            if (itemRows.children.length === 1) {
                return;
            }
            row.remove();
        });
        itemRows.appendChild(row);
    }

    function requestedItems() {
        return [...itemRows.querySelectorAll('.item-row')].map((row) => {
            const orderItemId = Number(row.querySelector('.order-item-id').value);
            const quantity = Number(row.querySelector('.refund-quantity').value);
            if (!Number.isSafeInteger(orderItemId) || orderItemId < 1 || !Number.isSafeInteger(quantity) || quantity < 1) {
                throw new Error('주문 항목 ID와 수량을 올바르게 입력하세요.');
            }
            return { orderItemId, quantity };
        });
    }

    async function run(action) {
        try {
            await action();
        } catch (error) {
            resultElement.textContent = `오류\n\n${error.message}`;
        }
    }

    document.getElementById('add-item').addEventListener('click', addItemRow);
    addItemRow();

    document.getElementById('customer-request-form').addEventListener('submit', (event) => run(async () => {
        event.preventDefault();
        const token = tokenOf('customer-token');
        const orderId = numberOf('order-id', '주문 ID');
        const body = await request('POST', `/api/orders/${orderId}/refunds`, token, {
            reason: document.getElementById('request-reason').value.trim(),
            items: requestedItems()
        });
        const refundId = body.data?.refundId;
        if (refundId) {
            document.getElementById('customer-refund-id').value = refundId;
            document.getElementById('admin-refund-id').value = refundId;
        }
    }));

    document.getElementById('get-my-refunds').addEventListener('click', () => run(() =>
        request('GET', '/api/refunds', tokenOf('customer-token'))
    ));

    document.getElementById('get-my-refund-detail').addEventListener('click', () => run(() => {
        const refundId = numberOf('customer-refund-id', '환불 ID');
        return request('GET', `/api/refunds/${refundId}`, tokenOf('customer-token'));
    }));

    document.getElementById('get-admin-refund-detail').addEventListener('click', () => run(() => {
        const refundId = numberOf('admin-refund-id', '환불 ID');
        return request('GET', `/api/admin/refunds/${refundId}`, tokenOf('admin-token'));
    }));

    document.getElementById('approve-refund').addEventListener('click', () => run(() => {
        const refundId = numberOf('admin-refund-id', '환불 ID');
        return request('POST', `/api/admin/refunds/${refundId}/approve`, tokenOf('admin-token'));
    }));

    document.getElementById('reject-refund').addEventListener('click', () => run(() => {
        const refundId = numberOf('admin-refund-id', '환불 ID');
        const reason = document.getElementById('reject-reason').value.trim();
        if (!reason) {
            throw new Error('거절 사유를 입력하세요.');
        }
        return request('POST', `/api/admin/refunds/${refundId}/reject`, tokenOf('admin-token'), { reason });
    }));

    document.getElementById('get-admin-refunds').addEventListener('click', () => run(() => {
        const params = new URLSearchParams({ page: '1', size: '20' });
        const status = document.getElementById('refund-status').value;
        const from = document.getElementById('from-date').value;
        const to = document.getElementById('to-date').value;
        if (status) params.set('status', status);
        if (from) params.set('from', from);
        if (to) params.set('to', to);
        return request('GET', `/api/admin/refunds?${params}`, tokenOf('admin-token'));
    }));
</script>
</body>
</html>
