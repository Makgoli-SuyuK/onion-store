# 로컬 개발 DB 설정
spring.datasource.url=jdbc:mysql://localhost:3307/onion_store?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=onion
spring.datasource.password=onion
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 로컬에서 앱을 시작할 때 기존 테이블을 삭제하고 엔티티 기준으로 다시 생성한다.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.format_sql=true
