server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/onion_store?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: onion
    password: onion
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true

portone:
  base-url: ${PORTONE_BASE_URL}
  api-secret: ${PORTONE_API_SECRET}
  store-id: ${PORTONE_STORE_ID}
  channel-key: ${PORTONE_CHANNEL_KEY}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET}