services:
  spring:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onionstore-spring
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/onion_test
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    extra_hosts:
      - "host.docker.internal:host-gateway"

  k6:
    image: grafana/k6:latest
    container_name: onionstore-k6
    volumes:
      - ./k6:/scripts
    depends_on:
      - spring
    command:
      - run
      - /scripts/product-index.js