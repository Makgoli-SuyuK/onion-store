name: Compile

on:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    name: compile-java
    runs-on: ubuntu-latest

    steps:
      - name: 소스 코드 내려받기
        uses: actions/checkout@v5

      - name: Java 17 설정
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 컴파일 확인
        run: ./gradlew compileJava --no-daemon
